<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Сканер штрихкодов</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, #0f172a);
      color: var(--tg-theme-text-color, #f8fafc);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
      text-align: center;
    }
    .container {
      max-width: 420px;
      width: 100%;
      background: var(--tg-theme-secondary-bg-color, #1e293b);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .icon-wrapper {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(37, 99, 235, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    p {
      font-size: 15px;
      line-height: 1.5;
      color: var(--tg-theme-hint-color, #94a3b8);
      margin-bottom: 28px;
    }
    .btn {
      background-color: var(--tg-theme-button-color, #2563eb);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      border-radius: 16px;
      padding: 16px 24px;
      font-size: 16px;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    .status-badge {
      margin-top: 24px;
      padding: 10px 16px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      display: none;
    }
    .manual-input-box {
      margin-top: 24px;
      width: 100%;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .input-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.2);
      color: inherit;
      font-size: 15px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #3b82f6;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: inherit;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrapper">📷</div>
    <h1>Сканер штрихкодов</h1>
    <p>Наведите камеру смартфона на штрихкод товара на упаковке или ценнике для моментального добавления в список покупок.</p>
    
    <button class="btn" id="openCameraBtn">
      <span>Открыть камеру</span>
    </button>

    <div class="status-badge" id="statusBadge"></div>

    <div class="manual-input-box">
      <div style="font-size: 13px; color: var(--tg-theme-hint-color, #94a3b8);">Или введите цифры штрихкода вручную:</div>
      <div class="input-row">
        <input type="text" id="manualBarcode" placeholder="4600605021234" pattern="[0-9]*" inputmode="numeric">
        <button class="btn-secondary" id="submitManualBtn">ОК</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;

    function playBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 1760; // A6 note
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.15);
      } catch (e) {}
    }

    function transmitBarcode(barcode) {
      const clean = String(barcode || '').trim();
      if (!clean) return;

      playBeep();
      if (tg?.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred('success');
      }

      const badge = document.getElementById('statusBadge');
      badge.textContent = '✅ Считан код: ' + clean;
      badge.style.display = 'block';

      // 1. Send data directly if in private chat
      try {
        if (tg && typeof tg.sendData === 'function') {
          tg.sendData(clean);
          setTimeout(() => {
            try { tg.close(); } catch (e) {}
          }, 300);
          return;
        }
      } catch (err) {
        console.warn('sendData unavailable:', err);
      }

      // 2. Fallback: deep-link to bot if opened externally or in group
      setTimeout(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const botName = urlParams.get('bot') || 'tg_todo_bot';
        if (tg && typeof tg.openTelegramLink === 'function') {
          tg.openTelegramLink('https://t.me/' + botName + '?start=scan_' + clean);
        } else {
          window.location.href = 'https://t.me/' + botName + '?start=scan_' + clean;
        }
      }, 500);
    }

    function triggerNativeScanner() {
      if (!tg) {
        alert('Пожалуйста, откройте эту страницу через кнопку в Telegram боте.');
        return;
      }

      if (typeof tg.showScanQrPopup === 'function') {
        tg.showScanQrPopup({ text: 'Наведите камеру на штрихкод товара' }, function(text) {
          if (text && text.trim()) {
            transmitBarcode(text.trim());
            return true;
          }
          return false;
        });
      } else {
        alert('Ваша версия Telegram не поддерживает встроенный сканер QR/штрихкодов.');
      }
    }

    if (tg) {
      tg.ready();
      tg.expand();

      document.getElementById('openCameraBtn').addEventListener('click', triggerNativeScanner);

      document.getElementById('submitManualBtn').addEventListener('click', function() {
        const val = document.getElementById('manualBarcode').value;
        if (val) transmitBarcode(val);
      });

      document.getElementById('manualBarcode').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          const val = document.getElementById('manualBarcode').value;
          if (val) transmitBarcode(val);
        }
      });

      // Automatically launch native phone camera scanner upon opening
      setTimeout(triggerNativeScanner, 200);
    }
  </script>
</body>
</html>
