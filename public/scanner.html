<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Сканер товаров</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 32px 20px;
      text-align: center;
      background-color: var(--tg-theme-bg-color, #f4f4f5);
      color: var(--tg-theme-text-color, #18181b);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
    }
    .card {
      background: var(--tg-theme-secondary-bg-color, #ffffff);
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 400px;
      width: 100%;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 16px;
      display: inline-block;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 22px;
      font-weight: 700;
    }
    p {
      margin: 0 0 24px 0;
      color: var(--tg-theme-hint-color, #71717a);
      font-size: 15px;
      line-height: 1.4;
    }
    .btn {
      background-color: var(--tg-theme-button-color, #2563eb);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      border-radius: 14px;
      padding: 16px 28px;
      font-size: 16px;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:active {
      opacity: 0.85;
    }
    .hint {
      margin-top: 20px;
      font-size: 13px;
      color: var(--tg-theme-hint-color, #a1a1aa);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📷</div>
    <h2>Сканер штрихкодов</h2>
    <p>Наведите камеру смартфона на штрихкод товара на упаковке или ценнике для быстрого добавления в корзину.</p>
    <button class="btn" id="scanBtn">Запустить камеру</button>
    <div class="hint">Товар автоматически определится и добавится в общий список с подсчетом цены.</div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();

      function openScanner() {
        if (typeof tg.showScanQrPopup === 'function') {
          tg.showScanQrPopup({ text: 'Наведите камеру на штрихкод' }, function(text) {
            if (text && text.trim()) {
              tg.sendData(text.trim());
              tg.close();
              return true;
            }
            return false;
          });
        } else {
          alert('Встроенный сканер не поддерживается в этой версии Telegram. Вы можете отправить фото со штрихкодом прямо в чат с ботом.');
        }
      }

      document.getElementById('scanBtn').addEventListener('click', openScanner);

      // Automatically launch native Telegram camera scanner shortly after opening
      setTimeout(openScanner, 150);
    }
  </script>
</body>
</html>
